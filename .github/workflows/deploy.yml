name: Deploy Website
on:
  push:
    branches:
      - deploy # ветка, при пуше в которую начнется деплой

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4
    
    - name: Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./ # какую папку из гитхаба отправлять
        server-dir: ./domains/aurea-studio.ru/public_html/ # куда загружать на хостинге
